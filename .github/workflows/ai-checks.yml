          } >> "$diagnostic_root/identity.txt"
      - name: Select the pinned Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install the hosted TSan compiler
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Apply the test-only flight observation patch
        shell: bash
        run: |
          set -euo pipefail
