          patch="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/minecraft-flight-snapshot.patch"
          high_water_patch="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/minecraft-server-high-water.patch"
          git -C "$source" apply --check "$patch"
          git -C "$source" apply "$patch"
          git -C "$source" apply --check "$high_water_patch"
          git -C "$source" apply "$high_water_patch"
          test "$(git -C "$source" status --porcelain=v1)" = ' M tests/core/game_server_preview_tests.cpp'
          test "$(shasum -a 256 "$source/tests/acceptance/client_launch_test.py" | cut -d ' ' -f 1)" = \
            'fc42595f414ba0c43e20562522b02b47cc246fef0900303dc15eb7fd5f896f7a'
      - name: Configure and run the bounded targeted Mac TSan cases
        id: targeted-tsan
        timeout-minutes: 15
        shell: bash
        env:
          CORECPP_ENET_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/targeted-tsan-diagnostic"
          source="$GITHUB_WORKSPACE/diagnostic-source"
          cd "$source"
          python script/ci/acquire.py verify-tools --platform macos
          compiler_path="$(brew --prefix llvm)/bin"
          test "$(command -v clang)" = "$compiler_path/clang"
          test "$(command -v clang++)" = "$compiler_path/clang++"
          test -z "${TSAN_OPTIONS:-}"
          printf 'xcode-select=%s\nclang-path=%s\nclangxx-path=%s\n' \
            "$(xcode-select -p)" "$(command -v clang)" "$(command -v clang++)" \
            >> "$diagnostic_root/identity.txt"
          clang --version | tee "$diagnostic_root/toolchain.log"
          clang++ --version | tee -a "$diagnostic_root/toolchain.log"
          grep -Fq '23.1.0' "$diagnostic_root/toolchain.log"
          printf 'effective-clang-version=23.1.0\n' >> "$diagnostic_root/identity.txt"
          cmake --preset analysis-macos-tsan \
            -DMC_ALLOW_INEXACT_CORECPP=ON \
            -DCOREPROJECT2026_ALLOW_INEXACT_CORECPP=ON \
            2>&1 | tee "$diagnostic_root/configure.log"
          grep -F -- '-fsanitize=thread' build/analysis-macos-tsan/compile_commands.json
          cmake --build build/analysis-macos-tsan --target mc_tests mc_main --parallel 4 --verbose \
            2>&1 | tee "$diagnostic_root/build.log"
          set +e
          ctest --test-dir build/analysis-macos-tsan --output-on-failure --no-tests=error -V \
            -R '^GameServerPreviewTest\.SustainedFlightKeepsInputAcknowledgementsCurrentWhileTilesStream$' \
            2>&1 | tee "$diagnostic_root/flight-ctest.log"
          flight_pipeline_status=("${PIPESTATUS[@]}")
          python "$GITHUB_WORKSPACE/script/ci/diagnostics/targeted_tsan_client.py" \
            --fixture "$source/tests/acceptance/client_launch_test.py" \
            --binary "$source/build/analysis-macos-tsan/mc_main" \
            --evidence-dir "$diagnostic_root/client-exit-evidence" \
            2>&1 | tee "$diagnostic_root/client-test.log"
          client_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${flight_pipeline_status[0]}" -ne 0 || "${flight_pipeline_status[1]}" -ne 0 || \
                "${client_pipeline_status[0]}" -ne 0 || "${client_pipeline_status[1]}" -ne 0 ]]; then
            exit 1
          fi
      - name: Upload raw targeted Mac TSan diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: targeted-macos-tsan-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/targeted-tsan-diagnostic/**
            diagnostic-source/build/analysis-macos-tsan/Testing/Temporary/LastTest.log
            diagnostic-source/build/analysis-macos-tsan/compile_commands.json
          if-no-files-found: warn
          retention-days: 14

  linux-analysis:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/ai-main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ai-dev')) && github.event.inputs.diagnostic != 'sustained-flight' && github.event.inputs.diagnostic != 'full-context-suite' && github.event.inputs.diagnostic != 'targeted-tsan'
    name: Linux analysis (${{ matrix.row }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux_lsan
            triplet: x64-linux-lsan
          - row: linux_msan
            triplet: x64-linux-msan
    env:
      CC: clang-18
      CXX: clang++-18
      MC_VCPKG_ANALYSIS_TRIPLET: ${{ matrix.triplet }}
      MC_VCPKG_CHAINLOAD_TOOLCHAIN_FILE: ${{ github.workspace }}/script/ci/vcpkg-clang-toolchain.cmake
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install Clang and pinned CMake, Ninja
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-18 libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev autoconf autoconf-archive automake libtool
          python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6 ninja==1.13.2
      - name: Materialize private dependency deploy keys
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Fetch exact private dependency commits
        shell: bash
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies"
          --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE"
          --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Select Clang for sanitizer dependencies
        run: |
          echo "CC=$(command -v clang-18)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v clang++-18)" >> "$GITHUB_ENV"
      - name: Install LeakSanitizer libc++
        if: matrix.row == 'linux_lsan'
        run: sudo apt-get install --no-install-recommends --yes libc++-18-dev libc++abi-18-dev
      - name: Verify LeakSanitizer C++23 standard library
        if: matrix.row == 'linux_lsan'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '#include <expected>' \
            '#ifndef __cpp_lib_expected' \
            '#error "selected C++23 standard library does not provide std::expected"' \
            '#endif' \
            'static_assert(__cpp_lib_expected >= 202202L);' \
            'int main() { std::expected<int, int> value = 1; return value.value(); }' \
            | "$CXX" -std=c++23 -stdlib=libc++ -x c++ -fsyntax-only -
          echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
      - name: Build and verify MemorySanitizer libc++
        if: matrix.row == 'linux_msan'
        run: >-
          python script/ci/install_msan_libcxx.py
          --source-root "$RUNNER_TEMP/llvm-project"
          --build-root "$RUNNER_TEMP/llvm-msan-build"
          --prefix "$RUNNER_TEMP/msan-libcxx"
          --clang "$CC" --clangxx "$CXX"
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "$RUNNER_TEMP/vcpkg"
      - name: Install instrumented vcpkg dependencies
        run: >-
          python script/ci/acquire.py install-manifest-dependencies
          --vcpkg-root "$RUNNER_TEMP/vcpkg" --platform linux-analysis
          --installed-root "$RUNNER_TEMP/vcpkg-installed"
      - name: Install instrumented private dependencies
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "--cmake-arg=-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            "--cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF"
            "--cmake-arg=-DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/script/ci/vcpkg-triplets"
            "--cmake-arg=-DVCPKG_TARGET_TRIPLET=$MC_VCPKG_ANALYSIS_TRIPLET"
            "--cmake-arg=-DCMAKE_C_COMPILER=$CC"
            "--cmake-arg=-DCMAKE_CXX_COMPILER=$CXX"
          )
          if [[ "${{ matrix.row }}" == linux_lsan ]]; then
            args+=(
              '--cmake-arg=-DCMAKE_C_FLAGS=-fsanitize=leak -fno-omit-frame-pointer'
              '--cmake-arg=-DCMAKE_CXX_FLAGS=-fsanitize=leak -fno-omit-frame-pointer -stdlib=libc++'
              '--cmake-arg=-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=leak -stdlib=libc++'
              '--cmake-arg=-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=leak -stdlib=libc++'
            )
          else
            args+=(
              "--cmake-arg=-DCMAKE_C_FLAGS=-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer"
              "--cmake-arg=-DCMAKE_CXX_FLAGS=-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -stdlib=libc++ -isystem $MC_MSAN_LIBCXX_PREFIX/include/c++/v1"
              "--cmake-arg=-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=memory -stdlib=libc++ -L$MC_MSAN_LIBCXX_PREFIX/lib -Wl,-rpath,$MC_MSAN_LIBCXX_PREFIX/lib"
              "--cmake-arg=-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=memory -stdlib=libc++ -L$MC_MSAN_LIBCXX_PREFIX/lib -Wl,-rpath,$MC_MSAN_LIBCXX_PREFIX/lib"
            )
          fi
          python script/ci/acquire.py install-private-dependencies \
            --root "$RUNNER_TEMP/private-dependencies" --platform linux-analysis \
            "${args[@]}"
      - name: Run candidate-bound Linux sanitizer row
        run: >-
          python script/ai_analysis_matrix.py run-row
          "build/ai-analysis/${{ matrix.row }}.json" --row "${{ matrix.row }}"
      - name: Upload Linux sanitizer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-linux-${{ matrix.row }}-${{ github.sha }}
          path: build/ai-analysis/${{ matrix.row }}.json
          if-no-files-found: warn
          retention-days: 14

  android-hwasan-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ai-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Select Java 21 from the hosted tool cache
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Materialize private dependency deploy keys
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Fetch exact private dependency commits
        shell: bash
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies"
          --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE"
          --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Bootstrap pinned Android SDK and NDK
        run: python script/ci/acquire.py install-android-sdk --root "$RUNNER_TEMP/android-sdk"
      - name: Expose Android NDK clang-tidy
        shell: bash
        run: echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install host autotools for vcpkg GMP and MPFR
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes autoconf autoconf-archive automake libtool
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "$RUNNER_TEMP/vcpkg"
      - name: Install HWASan-instrumented vcpkg dependencies
        run: >-
          python script/ci/acquire.py install-manifest-dependencies
          --vcpkg-root "$RUNNER_TEMP/vcpkg" --platform android-hwasan
          --installed-root "$RUNNER_TEMP/vcpkg-installed"
      - name: Install HWASan-instrumented private dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/corelang-android-compat.cmake" <<'EOF'
          add_compile_options(-Wno-error=reorder-init-list)
          EOF
          python script/ci/acquire.py install-private-dependencies \
            --root "$RUNNER_TEMP/private-dependencies" --platform android-hwasan \
            --cmake-arg=-DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            --cmake-arg=-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            --cmake-arg=-DCMAKE_PROJECT_INCLUDE_BEFORE="$RUNNER_TEMP/corelang-android-compat.cmake" \
            --cmake-arg=-DANDROID_ABI=arm64-v8a \
            --cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF
      - name: Build and verify the HWASan APK
        run: >-
          android/gradlew --no-daemon --stacktrace
          -Psanitizer=hwasan -PvcpkgManifestInstall=OFF
          -PvcpkgInstalledDir="$VCPKG_INSTALLED_DIR"
          -PcmakePrefixPath="$MC_PRIVATE_DEPENDENCIES_PREFIX"
          -PcoreCppDir="$MC_PRIVATE_DEPENDENCIES_PREFIX/lib/cmake/CoreCpp"
          -PcoreProjectDir="$MC_PRIVATE_DEPENDENCIES_PREFIX/lib/cmake/CoreProject2026"
          :app:assembleRelease
      - name: Preflight HWASan APK before upload
        run: >-
          python script/ci/verify_android_hwasan.py
          --apk android/app/build/outputs/apk/release/app-release.apk
          --apk-only
      - name: Run candidate-bound Android clang-tidy row
        run: >-
          python script/ai_analysis_matrix.py run-row build/ai-analysis/android_clang_tidy.json
          --row android_clang_tidy
      - name: Upload Android clang-tidy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-android-static-${{ github.sha }}
          path: build/ai-analysis/android_clang_tidy.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload HWASan APK for arm64 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hwasan-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  android-hwasan-runtime:
    needs: android-hwasan-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/ai-main'
    runs-on: "mc-s7-hwasan-${{ github.sha }}-${{ github.run_id }}"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - name: Select and validate Java 21
        run: >-
          python script/ci/android_hwasan_emulator.py select-java
          --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Create isolated Android emulator homes
        run: >-
          python script/ci/android_hwasan_emulator.py prepare
          --runner-temp "$RUNNER_TEMP"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --github-env "$GITHUB_ENV"
      - name: Bootstrap pinned Android SDK tools
        run: >-
          python script/ci/acquire.py install-android-runtime-sdk
          --root "$ANDROID_SDK_ROOT"
          --seed-root "${MC_ANDROID_SDK_SEED_ROOT:-}"
      - name: Expose Android platform tools and emulator
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Download HWASan APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hwasan-apk-${{ github.sha }}
          path: build/hwasan
      - name: Preflight downloaded HWASan APK before emulator startup
        run: >-
          python script/ci/verify_android_hwasan.py
          --apk build/hwasan/app-release.apk
          --apk-only
      - name: Start matching ARM64 Android emulator with host acceleration
        run: >-
          python script/ci/android_hwasan_emulator.py start
          --runner-temp "$RUNNER_TEMP"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --sdk-root "$ANDROID_SDK_ROOT"
      - name: Wait for the owned Android emulator
        run: >-
          python script/ci/android_hwasan_emulator.py wait
          --runner-temp "$RUNNER_TEMP"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --timeout-seconds 1200
      - name: Run candidate-bound Android HWASan runtime row
        run: >-
          python script/ai_analysis_matrix.py run-row build/ai-analysis/android_arm64_hwasan.json
          --row android_arm64_hwasan
      - name: Upload Android HWASan runtime receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-android-${{ github.sha }}
          path: build/ai-analysis/android_arm64_hwasan.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android HWASan emulator log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hwasan-emulator-log-${{ github.sha }}
          path: ${{ runner.temp }}/mc-hwasan-${{ github.run_id }}-${{ github.run_attempt }}/emulator.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop owned Android emulator and remove private AVD state
        if: always()
        run: >-
          python script/ci/android_hwasan_emulator.py cleanup
          --runner-temp "$RUNNER_TEMP"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

  analysis-matrix:
    name: S7 sanitizer and static-analysis matrix
    needs: [desktop, linux-analysis, android-hwasan-runtime]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/ai-main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Download candidate-bound row receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: analysis-*-${{ github.sha }}
          path: build/ai-checks/rows
          merge-multiple: true
      - name: Merge and verify the complete exact-candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(build/ai-checks/rows/*.json)
          if (( ${#receipts[@]} == 0 )); then
            echo 'No sanitizer/static-analysis receipts were uploaded.' >&2
            exit 1
          fi
          receipt_arguments=()
          for receipt in "${receipts[@]}"; do
            receipt_arguments+=(--row-receipt "$receipt")
          done
          python script/ai_analysis_matrix.py merge \
            --receipt build/ai-checks/analysis-matrix.json \
            "${receipt_arguments[@]}"
          python script/ai_analysis_matrix.py verify build/ai-checks/analysis-matrix.json
      - name: Upload complete S7 analysis receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-matrix-${{ github.sha }}
          path: build/ai-checks/analysis-matrix.json
          if-no-files-found: error
          retention-days: 90
