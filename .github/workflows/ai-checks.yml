name: AI checks

on:
  push:
    branches: [ai-dev, ai-main, 'codex/ai-*']
  pull_request:
    branches: [ai-dev, ai-main, 'codex/ai-*']
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run an isolated Mac sanitizer diagnostic
        type: choice
        options:
          - none
          - sustained-flight
          - full-context-suite
          - targeted-tsan
        default: none
        required: true

permissions:
  contents: read

jobs:
  fast:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.diagnostic != 'sustained-flight' && github.event.inputs.diagnostic != 'full-context-suite' && github.event.inputs.diagnostic != 'targeted-tsan')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install pinned Windows time-zone data
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check --no-cache-dir tzdata==2025.2
      - run: python script/ai_check.py --fast

  desktop:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ai-main' && github.event.inputs.diagnostic != 'sustained-flight' && github.event.inputs.diagnostic != 'full-context-suite' && github.event.inputs.diagnostic != 'targeted-tsan'
    name: desktop (${{ matrix.platform }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            preset: debug
          - platform: macos
            runner: macos-15
            preset: release
          - platform: windows
            runner: windows-2022
            preset: debug
          - platform: windows
            runner: windows-2022
            preset: release
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      VCPKG_DISABLE_METRICS: '1'
      CTEST_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Materialize private dependency deploy keys (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Materialize private dependency deploy keys (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          $keyRoot = Join-Path $env:RUNNER_TEMP 'private-dependency-keys'
          New-Item -ItemType Directory -Force -Path $keyRoot | Out-Null
          $coreCppKey = Join-Path $keyRoot 'corecpp'
          $coreProjectKey = Join-Path $keyRoot 'coreproject2026'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $coreCppText = $env:MC_CI_CORECPP_DEPLOY_KEY.Replace("`r`n", "`n").Replace("`r", "`n").TrimEnd([char[]]"`n") + "`n"
          $coreProjectText = $env:MC_CI_COREPROJECT2026_DEPLOY_KEY.Replace("`r`n", "`n").Replace("`r", "`n").TrimEnd([char[]]"`n") + "`n"
          [System.IO.File]::WriteAllText($coreCppKey, $coreCppText, $utf8NoBom)
          [System.IO.File]::WriteAllText($coreProjectKey, $coreProjectText, $utf8NoBom)
          $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $grant = '{0}:F' -f $currentUser
          foreach ($keyPath in @($keyRoot, $coreCppKey, $coreProjectKey)) {
            & icacls.exe $keyPath /inheritance:r /grant:r $grant | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "icacls failed for $keyPath with exit code $LASTEXITCODE"
            }
          }
          foreach ($keyPath in @($coreCppKey, $coreProjectKey)) {
            $bytes = [System.IO.File]::ReadAllBytes($keyPath)
            if ($bytes.Length -lt 3 -or $bytes[-1] -ne 10 -or $bytes -contains 13 -or ($bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191)) {
              throw "deploy key encoding validation failed for $keyPath"
            }
            & ssh-keygen.exe -y -f $keyPath *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "ssh-keygen rejected deploy key $keyPath"
            }
          }
          "MC_CI_CORECPP_DEPLOY_KEY_FILE=$coreCppKey" >> $env:GITHUB_ENV
          "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$coreProjectKey" >> $env:GITHUB_ENV
      - name: Fetch exact private dependency commits (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies"
          --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE"
          --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Fetch exact private dependency commits (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          python script/ci/acquire.py fetch-private-dependencies --root "%RUNNER_TEMP%\private-dependencies" --corecpp-key "%MC_CI_CORECPP_DEPLOY_KEY_FILE%" --coreproject2026-key "%MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE%"
          if errorlevel 1 exit /b %errorlevel%
      - name: Configure vcpkg binary cache (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cache_dir="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$cache_dir"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache_dir" >> "$GITHUB_ENV"
      - name: Configure vcpkg binary cache (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\vcpkg-binary-cache" mkdir "%RUNNER_TEMP%\vcpkg-binary-cache"
          if errorlevel 1 exit /b %errorlevel%
          echo VCPKG_DEFAULT_BINARY_CACHE=%RUNNER_TEMP%\vcpkg-binary-cache>>"%GITHUB_ENV%"
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'script/ci/acquire.py', 'script/ci/vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Windows ASan vcpkg binary cache
        if: matrix.platform == 'windows' && matrix.preset == 'debug'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-windows-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'script/ci/acquire.py', 'script/ci/vcpkg-overlays/**', 'script/ci/vcpkg-triplets/x64-windows-asan.cmake') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-windows-asan-
      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6 tzdata==2025.2
      - name: Acquire pinned Ninja
        run: python script/ci/acquire.py install-ninja --platform ${{ matrix.platform }} --root "${{ runner.temp }}/ninja"
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "${{ runner.temp }}/vcpkg"
      - name: Install host autotools for vcpkg GMP and MPFR (macOS)
        if: matrix.platform == 'macos'
        run: brew install autoconf autoconf-archive automake libtool
      - name: Install pinned vcpkg manifest dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          python script/ci/acquire.py install-manifest-dependencies
          --vcpkg-root "$RUNNER_TEMP/vcpkg" --platform macos
          --installed-root "$RUNNER_TEMP/vcpkg-installed"
      - name: Install pinned vcpkg manifest dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          python script/ci/acquire.py install-manifest-dependencies --vcpkg-root "%RUNNER_TEMP%\vcpkg" --platform windows --installed-root "%RUNNER_TEMP%\vcpkg-installed"
          if errorlevel 1 exit /b %errorlevel%
      - name: Save vcpkg binary cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'script/ci/acquire.py', 'script/ci/vcpkg-overlays/**') }}
      - name: Acquire pinned Vulkan SDK (macOS)
        if: matrix.platform == 'macos'
        run: python script/ci/acquire.py install-vulkan --platform macos --root "$RUNNER_TEMP/vulkan-sdk"
      - name: Acquire pinned Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          python script/ci/acquire.py install-vulkan --platform windows --root "%RUNNER_TEMP%\vulkan-sdk"
          if errorlevel 1 exit /b %errorlevel%
      - name: Install pinned private dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          python script/ci/acquire.py install-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies" --platform macos
          --preset "${{ matrix.preset }}"
          --cmake-arg=-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          --cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF
      - name: Install pinned private dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          set "MC_ACQUIRED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          set "VCPKG_ROOT=%MC_ACQUIRED_VCPKG_ROOT%"
          python script/ci/acquire.py install-private-dependencies --root "%RUNNER_TEMP%\private-dependencies" --platform windows --preset "${{ matrix.preset }}" "--cmake-arg=-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" --cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF
          if errorlevel 1 exit /b %errorlevel%
      - name: Verify pre-finalization candidate source policy checks
        if: github.ref != 'refs/heads/ai-main'
        run: python script/ci/acquire.py source-checks --pre-finalization-candidate
      - name: Verify finalized source policy checks
        if: github.ref == 'refs/heads/ai-main'
        run: python script/ci/acquire.py source-checks --source-commit "${{ env.SOURCE_COMMIT }}"
      - name: Build, test, and validate shaders (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          python script/ci/acquire.py verify-tools --platform macos
          python script/ci/acquire.py record-metadata --platform macos --preset ${{ matrix.preset }} --output build/ci-metadata.json
          cmake --preset ${{ matrix.preset }} -DMC_ENABLE_RENDERER_SMOKE=OFF -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" -DCMAKE_PREFIX_PATH="$MC_PRIVATE_DEPENDENCIES_PREFIX" -DCoreCpp_DIR="$MC_PRIVATE_DEPENDENCIES_PREFIX/lib/cmake/CoreCpp" -DCoreProject2026_DIR="$MC_PRIVATE_DEPENDENCIES_PREFIX/lib/cmake/CoreProject2026"
          cmake --build --preset ${{ matrix.preset }}
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error --timeout 60
          python script/ci/acquire.py validate-shaders --build-dir build/${{ matrix.preset }}
      - name: Build, test, and validate shaders (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          set "MC_ACQUIRED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          set "VCPKG_ROOT=%MC_ACQUIRED_VCPKG_ROOT%"
          python script/ci/acquire.py verify-tools --platform windows
          if errorlevel 1 exit /b %errorlevel%
          python script/ci/acquire.py record-metadata --platform windows --preset ${{ matrix.preset }} --output build/ci-metadata.json
          if errorlevel 1 exit /b %errorlevel%
          cmake --preset ${{ matrix.preset }} -DMC_ENABLE_RENDERER_SMOKE=OFF -DVCPKG_MANIFEST_INSTALL=OFF -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DCMAKE_PREFIX_PATH="%MC_PRIVATE_DEPENDENCIES_PREFIX%" -DCoreCpp_DIR="%MC_PRIVATE_DEPENDENCIES_PREFIX%/lib/cmake/CoreCpp" -DCoreProject2026_DIR="%MC_PRIVATE_DEPENDENCIES_PREFIX%/lib/cmake/CoreProject2026"
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset ${{ matrix.preset }}
          if errorlevel 1 exit /b %errorlevel%
          ctest --test-dir build\${{ matrix.preset }} --output-on-failure --no-tests=error --timeout 60
          if errorlevel 1 exit /b %errorlevel%
          python script/ci/acquire.py validate-shaders --build-dir build\${{ matrix.preset }}
          if errorlevel 1 exit /b %errorlevel%
      - name: Install pinned Windows ASan manifest dependencies
        if: matrix.platform == 'windows' && matrix.preset == 'debug'
        shell: cmd
        run: |
          python script/ci/acquire.py install-manifest-dependencies --vcpkg-root "%RUNNER_TEMP%\vcpkg" --platform windows-asan --installed-root "%RUNNER_TEMP%\vcpkg-installed-windows-asan"
          if errorlevel 1 exit /b %errorlevel%
      - name: Save Windows ASan vcpkg binary cache
        if: matrix.platform == 'windows' && matrix.preset == 'debug'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-windows-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'script/ci/acquire.py', 'script/ci/vcpkg-overlays/**', 'script/ci/vcpkg-triplets/x64-windows-asan.cmake') }}
      - name: Install pinned Windows ASan private dependencies
        if: matrix.platform == 'windows' && matrix.preset == 'debug'
        shell: cmd
        run: |
          set "MC_ACQUIRED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          set "VCPKG_ROOT=%MC_ACQUIRED_VCPKG_ROOT%"
          python script/ci/acquire.py install-private-dependencies --root "%RUNNER_TEMP%\private-dependencies" --output-root "%RUNNER_TEMP%\private-dependencies-windows-asan" --platform windows --preset release --cmake-arg=-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake --cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF --cmake-arg=-DVCPKG_TARGET_TRIPLET=x64-windows-asan --cmake-arg=-DVCPKG_OVERLAY_TRIPLETS=%GITHUB_WORKSPACE%/script/ci/vcpkg-triplets --cmake-arg="-DCMAKE_C_FLAGS=/fsanitize=address /Zi" --cmake-arg="-DCMAKE_CXX_FLAGS=/fsanitize=address /EHsc /Zi /bigobj"
          if errorlevel 1 exit /b %errorlevel%
      - name: Install macOS static-analysis tools
        if: matrix.platform == 'macos' && matrix.preset == 'debug'
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm cppcheck include-what-you-use
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Run required macOS analysis rows
        if: matrix.platform == 'macos' && matrix.preset == 'debug'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ai-analysis
          for row in macos_asan macos_ubsan macos_tsan clang_static_analysis clang_tidy iwyu cppcheck; do
            python script/ai_analysis_matrix.py run-row "build/ai-analysis/$row.json" --row "$row"
          done
      - name: Run required Windows analysis rows
        if: matrix.platform == 'windows' && matrix.preset == 'debug'
        shell: cmd
        run: |
          set "MC_ACQUIRED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%MC_ACQUIRED_VCPKG_ROOT%"
          if not exist build\ai-analysis mkdir build\ai-analysis
          if errorlevel 1 exit /b 1
          set "MC_PRIVATE_DEPENDENCIES_PREFIX=%RUNNER_TEMP%\private-dependencies-windows-asan\install"
          set "CMAKE_PREFIX_PATH=%RUNNER_TEMP%\private-dependencies-windows-asan\install"
          set "VCPKG_INSTALLED_DIR=%RUNNER_TEMP%\vcpkg-installed-windows-asan"
          python script/ai_analysis_matrix.py run-row build\ai-analysis\windows_msvc_asan.json --row windows_msvc_asan
          set "MC_ASAN_ROW_STATUS=%ERRORLEVEL%"
          set "MC_PRIVATE_DEPENDENCIES_PREFIX=%RUNNER_TEMP%\private-dependencies\install"
          set "CMAKE_PREFIX_PATH=%RUNNER_TEMP%\private-dependencies\install"
          set "VCPKG_INSTALLED_DIR=%RUNNER_TEMP%\vcpkg-installed"
          python script/ai_analysis_matrix.py run-row build\ai-analysis\windows_msvc_analyze.json --row windows_msvc_analyze
          set "MC_ANALYZE_ROW_STATUS=%ERRORLEVEL%"
          if not "%MC_ASAN_ROW_STATUS%"=="0" exit /b %MC_ASAN_ROW_STATUS%
          if not "%MC_ANALYZE_ROW_STATUS%"=="0" exit /b %MC_ANALYZE_ROW_STATUS%
      - name: Upload macOS analysis row receipts
        if: always() && matrix.platform == 'macos' && matrix.preset == 'debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-desktop-macos-${{ github.sha }}
          path: build/ai-analysis/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows analysis row receipts
        if: always() && matrix.platform == 'windows' && matrix.preset == 'debug'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analysis-desktop-windows-${{ github.sha }}
          path: build/ai-analysis/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-ci-${{ matrix.platform }}-${{ matrix.preset }}-${{ github.sha }}
          path: |
            build/ci-metadata.json
            build/ai-checks/python-tests.log
            build/${{ matrix.preset }}/Testing/**
            build/${{ matrix.preset }}/**/*.log
            build/ai-analysis/*.json
            build/analysis-iwyu/gate/**
            build/analysis-cppcheck/gate/**
          if-no-files-found: warn
          retention-days: 14

  sustained-flight-macos-asan:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.diagnostic == 'sustained-flight' || github.event.inputs.diagnostic == 'full-context-suite') && github.ref == 'refs/heads/ai-dev'
    name: ${{ github.event.inputs.diagnostic }} Mac ASan diagnostic (not release evidence)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VCPKG_DISABLE_METRICS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 51b4b2199058b159537ad45b8334e1c04ccdc129
          path: diagnostic-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Validate immutable diagnostic inputs before using deploy keys
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ai-dev'
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/diagnostic-source" rev-parse HEAD)" = '51b4b2199058b159537ad45b8334e1c04ccdc129'
          test -z "$(git -C "$GITHUB_WORKSPACE/diagnostic-source" status --porcelain=v1)"
          printf '%s  %s\n' \
            '89d76661e86057ad146463ceda38979b2e85d8d20c8d574bc37eff8bd7dedd13' \
            'script/ci/diagnostics/sustained-flight/corecpp-host-transport.patch' \
            'c83381b06dea8338d56277a91c66802486e7d4d48929e5e25076497088b875d1' \
            'script/ci/diagnostics/sustained-flight/minecraft-flight-snapshot.patch' \
            | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sustained-flight-diagnostic"
          {
            printf 'delivery-workflow-sha=%s\n' "$GITHUB_SHA"
            printf 'diagnostic-source-sha=%s\n' '51b4b2199058b159537ad45b8334e1c04ccdc129'
            printf 'corecpp-base-sha=%s\n' '2ad29f7ed590e41c8ad7c9d4027c781650a10391'
            printf 'coreproject2026-base-sha=%s\n' 'e577c84671357625d0db7008395854018316c3f8'
            printf 'corecpp-patch-sha256=%s\n' '89d76661e86057ad146463ceda38979b2e85d8d20c8d574bc37eff8bd7dedd13'
            printf 'minecraft-patch-sha256=%s\n' 'c83381b06dea8338d56277a91c66802486e7d4d48929e5e25076497088b875d1'
            printf '%s\n' 'purpose=diagnostic-only; not release qualification'
          } > "$RUNNER_TEMP/sustained-flight-diagnostic/identity.txt"
      - name: Materialize private dependency deploy keys
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Fetch the locked private dependencies
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" fetch-private-dependencies \
            --lock "$GITHUB_WORKSPACE/diagnostic-source/dependencies.lock.json" \
            --root "$RUNNER_TEMP/private-dependencies" \
            --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE" \
            --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Validate and apply the CoreCpp transport-observation patch
        shell: bash
        run: |
          set -euo pipefail
          corecpp="$RUNNER_TEMP/private-dependencies/CoreCpp"
          test "$(git -C "$corecpp" rev-parse HEAD)" = '2ad29f7ed590e41c8ad7c9d4027c781650a10391'
          git -C "$corecpp" apply --check "$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/corecpp-host-transport.patch"
          git -C "$corecpp" apply "$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/corecpp-host-transport.patch"
          test "$(git -C "$corecpp" status --porcelain=v1)" = ' M src/runtime/network/src/Host.cpp'
      - name: Configure the pinned vcpkg cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
      - name: Restore pinned vcpkg binary cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('diagnostic-source/vcpkg.json', 'diagnostic-source/vcpkg-configuration.json', 'diagnostic-source/script/ci/acquire.py', 'diagnostic-source/script/ci/vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6 tzdata==2025.2
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-ninja --platform macos --root "$RUNNER_TEMP/ninja"
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-vcpkg --root "$RUNNER_TEMP/vcpkg"
      - name: Install vcpkg host tools and manifest dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf autoconf-archive automake libtool
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-manifest-dependencies --vcpkg-root "$RUNNER_TEMP/vcpkg" --platform macos --installed-root "$RUNNER_TEMP/vcpkg-installed"
      - name: Acquire the pinned Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-vulkan --platform macos --root "$RUNNER_TEMP/vulkan-sdk"
      - name: Install private dependencies with the hosted debug recipe
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-private-dependencies \
            --root "$RUNNER_TEMP/private-dependencies" --platform macos --preset debug \
            --cmake-arg=-DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            --cmake-arg=-DVCPKG_MANIFEST_INSTALL=OFF \
            --cmake-arg=-DCOREPROJECT2026_ALLOW_INEXACT_CORECPP=ON
      - name: Select the pinned Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install the hosted macOS analysis toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm cppcheck include-what-you-use
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Apply the test-only flight diagnostics
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/diagnostic-source"
          patch="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/minecraft-flight-snapshot.patch"
          git -C "$source" apply --check "$patch"
          git -C "$source" apply "$patch"
          test "$(git -C "$source" status --porcelain=v1)" = ' M tests/core/game_server_preview_tests.cpp'
          echo "MC_ANALYSIS_ROOT=$source" >> "$GITHUB_ENV"
      - name: Configure the hosted Mac ASan preset and inspect active tools
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/diagnostic-source/script/ci/macos_lsan.supp:print_suppressions=1
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/diagnostic-source"
          python script/ci/acquire.py verify-tools --platform macos
          compiler_path="$(brew --prefix llvm)/bin"
          test "$(command -v clang)" = "$compiler_path/clang"
          test "$(command -v clang++)" = "$compiler_path/clang++"
          printf 'xcode-select=%s\nclang-path=%s\nclangxx-path=%s\n' \
            "$(xcode-select -p)" "$(command -v clang)" "$(command -v clang++)" \
            >> "$RUNNER_TEMP/sustained-flight-diagnostic/identity.txt"
          clang --version | tee "$RUNNER_TEMP/sustained-flight-diagnostic/toolchain.log"
          clang++ --version | tee -a "$RUNNER_TEMP/sustained-flight-diagnostic/toolchain.log"
          cmake --version | tee -a "$RUNNER_TEMP/sustained-flight-diagnostic/toolchain.log"
          grep -Fq '23.1.0' "$RUNNER_TEMP/sustained-flight-diagnostic/toolchain.log"
          printf 'effective-clang-version=23.1.0\n' >> "$RUNNER_TEMP/sustained-flight-diagnostic/identity.txt"
          python script/ci/verify_macos_lsan.py controls --build-dir build/analysis-macos-asan/lsan-controls \
            2>&1 | tee "$RUNNER_TEMP/sustained-flight-diagnostic/lsan-controls.log"
          cmake --preset analysis-macos-asan \
            -DMC_ALLOW_INEXACT_CORECPP=ON \
            -DCOREPROJECT2026_ALLOW_INEXACT_CORECPP=ON \
            2>&1 | tee "$RUNNER_TEMP/sustained-flight-diagnostic/configure.log"
          grep -F -- '-fsanitize=address' build/analysis-macos-asan/compile_commands.json
      - name: Build and run only the sustained-flight test with unchanged limits
        if: github.event.inputs.diagnostic == 'sustained-flight'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/diagnostic-source/script/ci/macos_lsan.supp:print_suppressions=1
          CORECPP_ENET_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/sustained-flight-diagnostic"
          source="$GITHUB_WORKSPACE/diagnostic-source"
          cd "$source"
          cmake --build build/analysis-macos-asan --target mc_tests --parallel 4 --verbose \
            2>&1 | tee "$diagnostic_root/build.log"
          ctest --test-dir build/analysis-macos-asan --output-on-failure --no-tests=error --timeout 60 -V \
            -R '^GameServerPreviewTest\.SustainedFlightKeepsInputAcknowledgementsCurrentWhileTilesStream$' \
            2>&1 | tee "$diagnostic_root/ctest.log"
          python script/ci/verify_macos_lsan.py summarize \
            --last-test-log build/analysis-macos-asan/Testing/Temporary/LastTest.log \
            2>&1 | tee "$diagnostic_root/lsan-summary.log"
      - name: Build and run the full hosted Mac ASan context
        if: github.event.inputs.diagnostic == 'full-context-suite'
        timeout-minutes: 15
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/diagnostic-source/script/ci/macos_lsan.supp:print_suppressions=1
          CORECPP_ENET_DIAGNOSTICS: '1'
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/sustained-flight-diagnostic"
          source="$GITHUB_WORKSPACE/diagnostic-source"
          cd "$source"
          cmake --build --preset analysis-macos-asan \
            2>&1 | tee "$diagnostic_root/build.log"
          ctest --test-dir build/analysis-macos-asan --output-on-failure --no-tests=error \
            2>&1 | tee "$diagnostic_root/ctest.log"
          python script/ci/verify_macos_lsan.py summarize \
            --last-test-log build/analysis-macos-asan/Testing/Temporary/LastTest.log \
            2>&1 | tee "$diagnostic_root/lsan-summary.log"
      - name: Upload raw Mac ASan diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event.inputs.diagnostic }}-macos-asan-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sustained-flight-diagnostic/**
            diagnostic-source/build/analysis-macos-asan/Testing/Temporary/LastTest.log
            diagnostic-source/build/analysis-macos-asan/compile_commands.json
          if-no-files-found: warn
          retention-days: 14

  targeted-tsan-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnostic == 'targeted-tsan' && github.ref == 'refs/heads/ai-dev'
    name: targeted Mac TSan diagnostic (not release evidence)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 51b4b2199058b159537ad45b8334e1c04ccdc129
          path: diagnostic-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Validate immutable diagnostic inputs before using deploy keys
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ai-dev'
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          source="$GITHUB_WORKSPACE/diagnostic-source"
          test "$(git -C "$source" rev-parse HEAD)" = '51b4b2199058b159537ad45b8334e1c04ccdc129'
          test -z "$(git -C "$source" status --porcelain=v1)"
          (
            cd "$source"
            printf '%s  %s\n' \
              'fc42595f414ba0c43e20562522b02b47cc246fef0900303dc15eb7fd5f896f7a' \
              'tests/acceptance/client_launch_test.py' \
              'd9e2d8db43569cb5f79310d0382541ea71012f0b59556051edbc718d3234e5bf' \
              'tests/core/game_server_preview_tests.cpp' \
              | shasum -a 256 -c
          )
          cd "$GITHUB_WORKSPACE"
          printf '%s  %s\n' \
            '89d76661e86057ad146463ceda38979b2e85d8d20c8d574bc37eff8bd7dedd13' \
            'script/ci/diagnostics/sustained-flight/corecpp-host-transport.patch' \
            '362bd687350dbc38348c1189bfc558781ef5f44e76b4d081f3fde157e1786daa' \
            'script/ci/diagnostics/sustained-flight/corecpp-host-enet-rejection.patch' \
            'c83381b06dea8338d56277a91c66802486e7d4d48929e5e25076497088b875d1' \
            'script/ci/diagnostics/sustained-flight/minecraft-flight-snapshot.patch' \
            'f09a4160bcbc5227804d5559e874d379f263cb58d2303d467a554722e846cc77' \
            'script/ci/diagnostics/sustained-flight/minecraft-server-high-water.patch' \
            'd8b1fc97f9fe2d73b46826ac4c69e2676c9718b32ec39d4a91cf3cf7626a50ce' \
            'script/ci/diagnostics/sustained-flight/vcpkg-overlay/enet/portfile.cmake' \
            'c1580858a1a8d8c239d9616dd795124bc40b5a331b4d21508abf311fc2c3017b' \
            'script/ci/diagnostics/sustained-flight/vcpkg-overlay/enet/vcpkg.json' \
            'ee684206d098276ca0dda9a16894b9f7f7ed3af5e397512dfba6c2f95a7b0e5a' \
            'script/ci/diagnostics/sustained-flight/vcpkg-overlay/enet/fix-export.patch' \
            '48a7db20f5365c834fb2a4aef3f5b0b3d3c1794480535e96505d2bb98c82c6d2' \
            'script/ci/diagnostics/sustained-flight/vcpkg-overlay/enet/enet-rejection-probe.patch' \
            '94ce2931a7fa2bfc11aae0c36bf40dc4e8f3860da969c499485284b2cbb502a6' \
            'script/ci/diagnostics/targeted_tsan_client.py' \
            | shasum -a 256 -c
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("diagnostic-source/script/ai_analysis_matrix.json").read_text())
          row = next(row for row in manifest["rows"] if row["id"] == "macos_tsan")
          assert row["flags"] == [
              "-DCMAKE_BUILD_TYPE=Release",
              "-DMC_ENABLE_HIGH_ASSERT=OFF",
              "-DMC_ENABLE_SANITIZERS=ON",
              "-DMC_SANITIZER=thread",
          ]
          assert row["required_compile_flags"] == ["-fsanitize=thread"]
          assert row.get("environment", {}) == {}
          assert row["commands"] == [
              ["cmake", "--preset", "analysis-macos-tsan"],
              ["cmake", "--build", "--preset", "analysis-macos-tsan"],
              ["ctest", "--test-dir", "build/analysis-macos-tsan", "--output-on-failure", "--no-tests=error"],
          ]
          assert row["timeout_seconds"] == 900
          PY
          mkdir -p "$RUNNER_TEMP/targeted-tsan-diagnostic"
          {
            printf 'delivery-workflow-sha=%s\n' "$GITHUB_SHA"
            printf 'diagnostic-source-sha=%s\n' '51b4b2199058b159537ad45b8334e1c04ccdc129'
            printf 'corecpp-base-sha=%s\n' '2ad29f7ed590e41c8ad7c9d4027c781650a10391'
            printf 'coreproject2026-base-sha=%s\n' 'e577c84671357625d0db7008395854018316c3f8'
            printf '%s\n' 'preset=analysis-macos-tsan' 'purpose=targeted-diagnostic-only; not release qualification'
            printf '%s\n' 'test=GameServerPreviewTest.SustainedFlightKeepsInputAcknowledgementsCurrentWhileTilesStream'
            printf '%s\n' 'client-test=ClientLaunchTest.test_bot_remains_alive_until_delayed_server_starts'
            printf '%s\n' 'compiler=Homebrew LLVM clang 23.1.0' 'xcode=Xcode 26.2' 'timeout-seconds=900'
            printf '%s\n' 'provenance-override=allow-inexact-corecpp; exact-base plus hash-checked observation patches only; diagnostic-only'
          } > "$RUNNER_TEMP/targeted-tsan-diagnostic/identity.txt"
      - name: Materialize private dependency deploy keys
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
