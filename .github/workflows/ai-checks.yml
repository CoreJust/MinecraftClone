        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Fetch the locked private dependencies
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" fetch-private-dependencies \
            --lock "$GITHUB_WORKSPACE/diagnostic-source/dependencies.lock.json" \
            --root "$RUNNER_TEMP/private-dependencies" \
            --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE" \
            --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Validate and apply the ordered CoreCpp observation patches
        shell: bash
        run: |
          set -euo pipefail
          corecpp="$RUNNER_TEMP/private-dependencies/CoreCpp"
          coreproject="$RUNNER_TEMP/private-dependencies/CoreProject2026"
          test "$(git -C "$corecpp" rev-parse HEAD)" = '2ad29f7ed590e41c8ad7c9d4027c781650a10391'
          test "$(git -C "$coreproject" rev-parse HEAD)" = 'e577c84671357625d0db7008395854018316c3f8'
          transport="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/corecpp-host-transport.patch"
          rejection="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/corecpp-host-enet-rejection.patch"
          git -C "$corecpp" apply --check "$transport"
          git -C "$corecpp" apply "$transport"
          git -C "$corecpp" apply --check "$rejection"
          git -C "$corecpp" apply "$rejection"
          test "$(git -C "$corecpp" status --porcelain=v1)" = ' M src/runtime/network/src/Host.cpp'
      - name: Install the pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6 tzdata==2025.2
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-ninja --platform macos --root "$RUNNER_TEMP/ninja"
          python "$GITHUB_WORKSPACE/diagnostic-source/script/ci/acquire.py" install-vcpkg --root "$RUNNER_TEMP/vcpkg"
      - name: Build baseline Debug dependencies with the diagnostic ENet overlay
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf autoconf-archive automake libtool
          diagnostic_root="$RUNNER_TEMP/targeted-tsan-diagnostic"
          mkdir -p "$diagnostic_root"
          installed_root="$RUNNER_TEMP/vcpkg-installed-targeted-tsan"
          overlay="$GITHUB_WORKSPACE/script/ci/diagnostics/sustained-flight/vcpkg-overlay"
          vcpkg="$RUNNER_TEMP/vcpkg/vcpkg"
          export VCPKG_INSTALLED_DIR="$installed_root"
          "$vcpkg" install \
            --triplet=arm64-osx \
            --x-manifest-root="$GITHUB_WORKSPACE/diagnostic-source" \
            --x-install-root="$installed_root" \
            --overlay-ports="$overlay" \
            2>&1 | tee "$diagnostic_root/vcpkg.log"
