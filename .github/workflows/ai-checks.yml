name: AI checks

on:
  push:
    branches: [ai-dev, ai-main, 'codex/ai-*']
  pull_request:
    branches: [ai-dev, ai-main, 'codex/ai-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: python script/ai_check.py --fast

  desktop:
    name: desktop (${{ matrix.platform }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            preset: debug
          - platform: macos
            runner: macos-15
            preset: release
          - platform: windows
            runner: windows-2022
            preset: debug
          - platform: windows
            runner: windows-2022
            preset: release
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6
      - name: Acquire pinned Ninja
        run: python script/ci/acquire.py install-ninja --platform ${{ matrix.platform }} --root "${{ runner.temp }}/ninja"
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "${{ runner.temp }}/vcpkg"
      - name: Acquire pinned Vulkan SDK (macOS)
        if: matrix.platform == 'macos'
        run: python script/ci/acquire.py install-vulkan --platform macos --root "$RUNNER_TEMP/vulkan-sdk"
      - name: Acquire pinned Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: python script/ci/acquire.py install-vulkan --platform windows --root "%RUNNER_TEMP%\vulkan-sdk"
      - name: Verify source policy checks
        run: python script/ci/acquire.py source-checks
      - name: Build, test, and validate shaders (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          python script/ci/acquire.py verify-tools --platform macos
          python script/ci/acquire.py record-metadata --platform macos --preset ${{ matrix.preset }} --output build/ci-metadata.json
          cmake --preset ${{ matrix.preset }} -DMC_ENABLE_RENDERER_SMOKE=OFF
          cmake --build --preset ${{ matrix.preset }}
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error --timeout 60
          python script/ci/acquire.py validate-shaders --build-dir build/${{ matrix.preset }}
      - name: Build, test, and validate shaders (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          python script/ci/acquire.py verify-tools --platform windows
          python script/ci/acquire.py record-metadata --platform windows --preset ${{ matrix.preset }} --output build/ci-metadata.json
          cmake --preset ${{ matrix.preset }} -DMC_ENABLE_RENDERER_SMOKE=OFF
          cmake --build --preset ${{ matrix.preset }}
          ctest --test-dir build\${{ matrix.preset }} --output-on-failure --no-tests=error --timeout 60
          python script/ci/acquire.py validate-shaders --build-dir build\${{ matrix.preset }}
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-ci-${{ matrix.platform }}-${{ matrix.preset }}-${{ github.sha }}
          path: |
            build/ci-metadata.json
            build/${{ matrix.preset }}/Testing/**
            build/${{ matrix.preset }}/**/*.log
          if-no-files-found: warn
          retention-days: 14
