name: Snapshot artifacts

on:
  push:
    branches:
      - ai-main
    tags:
      - 'ai/*/*/*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or full commit to resolve once and build exactly
        required: true
        type: string
      version:
        description: Snapshot version in EPOCH.MAJOR.MINOR:SNAPSHOT form
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.trust.outputs.source_commit }}
      version: ${{ steps.identity.outputs.version }}
      version_slug: ${{ steps.identity.outputs.version_slug }}
      trusted_dependency_source: ${{ steps.trust.outputs.trusted_dependency_source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Authorize private dependency source
        id: trust
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          trusted=false
          case "$EVENT_NAME" in
            push)
              case "$EVENT_REF" in
                refs/heads/ai-main|refs/tags/ai/*/*/*) trusted=true ;;
              esac
              ;;
            workflow_dispatch)
              git fetch --quiet --no-tags origin +refs/heads/ai-main:refs/remotes/origin/ai-main
              git fetch --quiet origin '+refs/tags/ai/*:refs/tags/ai/*'
              if git merge-base --is-ancestor "$source_commit" refs/remotes/origin/ai-main \
                || git tag --points-at "$source_commit" | grep -Eq '^ai/[^/]+/[^/]+/[^/]+$'; then
                trusted=true
              fi
              ;;
          esac
          test "$trusted" = true
          {
            printf 'source_commit=%s\n' "$source_commit"
            printf 'trusted_dependency_source=true\n'
          } >> "$GITHUB_OUTPUT"
      - name: Resolve immutable source identity
        id: identity
        env:
          REQUESTED_REF: ${{ inputs.source_ref || github.ref }}
          SNAPSHOT_VERSION: ${{ inputs.version || '' }}
        run: >-
          python script/ci/build_snapshot.py source-identity
          --expected "${{ steps.trust.outputs.source_commit }}"
          --requested-ref "$REQUESTED_REF"
          --version "$SNAPSHOT_VERSION"
          --output build/source-identity.json
          --github-output "$GITHUB_OUTPUT"

  desktop:
    needs: source
    if: needs.source.outputs.trusted_dependency_source == 'true'
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2022
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
      SNAPSHOT_VERSION: ${{ needs.source.outputs.version }}
      VERSION_SLUG: ${{ needs.source.outputs.version_slug }}
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Materialize private dependency deploy keys (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Materialize private dependency deploy keys (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          $keyRoot = Join-Path $env:RUNNER_TEMP 'private-dependency-keys'
          New-Item -ItemType Directory -Force -Path $keyRoot | Out-Null
          $coreCppKey = Join-Path $keyRoot 'corecpp'
          $coreProjectKey = Join-Path $keyRoot 'coreproject2026'
          [System.IO.File]::WriteAllText($coreCppKey, $env:MC_CI_CORECPP_DEPLOY_KEY + [Environment]::NewLine)
          [System.IO.File]::WriteAllText($coreProjectKey, $env:MC_CI_COREPROJECT2026_DEPLOY_KEY + [Environment]::NewLine)
          icacls $keyRoot /inheritance:r /grant:r "$env:USERNAME:(OI)(CI)(R,W)" | Out-Null
          "MC_CI_CORECPP_DEPLOY_KEY_FILE=$coreCppKey" >> $env:GITHUB_ENV
          "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$coreProjectKey" >> $env:GITHUB_ENV
      - name: Fetch exact private dependency commits (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies"
          --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE"
          --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Fetch exact private dependency commits (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "%RUNNER_TEMP%\private-dependencies"
          --corecpp-key "%MC_CI_CORECPP_DEPLOY_KEY_FILE%"
          --coreproject2026-key "%MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE%"
      - name: Configure vcpkg binary cache (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cache_dir="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$cache_dir"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache_dir" >> "$GITHUB_ENV"
      - name: Configure vcpkg binary cache (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\vcpkg-binary-cache" mkdir "%RUNNER_TEMP%\vcpkg-binary-cache"
          echo VCPKG_DEFAULT_BINARY_CACHE=%RUNNER_TEMP%\vcpkg-binary-cache>>"%GITHUB_ENV%"
      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6
      - name: Acquire pinned Ninja
        run: python script/ci/acquire.py install-ninja --platform ${{ matrix.platform }} --root "${{ runner.temp }}/ninja"
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "${{ runner.temp }}/vcpkg"
      - name: Acquire pinned Vulkan SDK (macOS)
        if: matrix.platform == 'macos'
        run: python script/ci/acquire.py install-vulkan --platform macos --root "$RUNNER_TEMP/vulkan-sdk"
      - name: Acquire pinned Vulkan SDK (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: python script/ci/acquire.py install-vulkan --platform windows --root "%RUNNER_TEMP%\vulkan-sdk"
      - name: Install pinned private dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          python script/ci/acquire.py install-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies" --platform macos
          --cmake-arg "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Install pinned private dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: >-
          python script/ci/acquire.py install-private-dependencies
          --root "%RUNNER_TEMP%\private-dependencies" --platform windows
          --cmake-arg "-DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
      - name: Verify exact source
        shell: bash
        run: >-
          python script/ci/build_snapshot.py source-identity
          --expected "$SOURCE_COMMIT"
          --version "$SNAPSHOT_VERSION"
          --output build/source-identity.json
      - name: Verify finalized source policy
        run: python script/ci/acquire.py source-checks
      - name: Build, test, and package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          python script/ci/acquire.py verify-tools --platform macos
          python script/ci/acquire.py record-metadata --platform macos --preset release --output build/toolchain-macos.json
          cmake --preset release -DMC_ENABLE_RENDERER_SMOKE=OFF
          cmake --build --preset release
          ctest --test-dir build/release --output-on-failure --no-tests=error --timeout 60 | tee build/release-tests-macos.log
          python script/ci/acquire.py validate-shaders --build-dir build/release
          cmake --install build/release --prefix build/install
          mkdir -p dist
          python script/ci/build_snapshot.py package-desktop \
            --platform macos --install-root build/install \
            --vcpkg-installed build/release/vcpkg_installed \
            --sdk-root "$VULKAN_SDK" \
            --toolchain-evidence build/toolchain-macos.json \
            --work-root build/package-macos \
            --version "$SNAPSHOT_VERSION" --source-commit "$SOURCE_COMMIT" \
            --output "dist/minecraftclone-${VERSION_SLUG}-macos-arm64.tar.gz"
          python script/ci/build_snapshot.py write-evidence \
            --platform macos --configuration release --automated-verification passed \
            --version "$SNAPSHOT_VERSION" --source-commit "$SOURCE_COMMIT" \
            --artifact "dist/minecraftclone-${VERSION_SLUG}-macos-arm64.tar.gz" \
            --toolchain-evidence build/toolchain-macos.json \
            --output "dist/minecraftclone-${VERSION_SLUG}-macos-arm64-evidence.json"
          python script/ci/build_snapshot.py write-checksum \
            --artifact "dist/minecraftclone-${VERSION_SLUG}-macos-arm64.tar.gz" \
            --output "dist/minecraftclone-${VERSION_SLUG}-macos-arm64.tar.gz.sha256"
          python script/ci/acquire.py verify-private-dependency-artifact-exclusion \
            --artifact-root dist --private-dependency-root "$RUNNER_TEMP/private-dependencies"
      - name: Build, test, and package Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          set "MC_ACQUIRED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%MC_ACQUIRED_VCPKG_ROOT%"
          python script/ci/acquire.py verify-tools --platform windows
          if errorlevel 1 exit /b 1
          python script/ci/acquire.py record-metadata --platform windows --preset release --output build/toolchain-windows.json
          if errorlevel 1 exit /b 1
          cmake --preset release -DMC_ENABLE_RENDERER_SMOKE=OFF
          cmake --build --preset release
          ctest --test-dir build\release --output-on-failure --no-tests=error --timeout 60 > build\release-tests-windows.log 2>&1
          if errorlevel 1 (type build\release-tests-windows.log & exit /b 1)
          type build\release-tests-windows.log
          python script/ci/acquire.py validate-shaders --build-dir build\release
          cmake --install build\release --prefix build\install
          if not exist dist mkdir dist
          python script/ci/build_snapshot.py package-desktop --platform windows --install-root build/install --vcpkg-installed build/release/vcpkg_installed --runtime-search build/release/vcpkg_installed/x64-windows/bin --runtime-search "%VCToolsRedistDir%\x64\Microsoft.VC143.CRT" --toolchain-evidence build/toolchain-windows.json --work-root build/package-windows --version "%SNAPSHOT_VERSION%" --source-commit "%SOURCE_COMMIT%" --output "dist/minecraftclone-%VERSION_SLUG%-windows-x86_64.zip"
          python script/ci/build_snapshot.py write-evidence --platform windows --configuration release --automated-verification passed --version "%SNAPSHOT_VERSION%" --source-commit "%SOURCE_COMMIT%" --artifact "dist/minecraftclone-%VERSION_SLUG%-windows-x86_64.zip" --toolchain-evidence build/toolchain-windows.json --output "dist/minecraftclone-%VERSION_SLUG%-windows-x86_64-evidence.json"
          python script/ci/build_snapshot.py write-checksum --artifact "dist/minecraftclone-%VERSION_SLUG%-windows-x86_64.zip" --output "dist/minecraftclone-%VERSION_SLUG%-windows-x86_64.zip.sha256"
          python script/ci/acquire.py verify-private-dependency-artifact-exclusion --artifact-root dist --private-dependency-root "%RUNNER_TEMP%\private-dependencies"
          if errorlevel 1 exit /b 1
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.platform }}-${{ needs.source.outputs.version_slug }}-${{ needs.source.outputs.source_commit }}
          path: |
            dist/*
            build/source-identity.json
            build/toolchain-${{ matrix.platform }}.json
            build/release-tests-${{ matrix.platform }}.log
          if-no-files-found: error
          retention-days: 14

  android:
    needs: source
    if: needs.source.outputs.trusted_dependency_source == 'true'
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.source_commit }}
      SNAPSHOT_VERSION: ${{ needs.source.outputs.version }}
      VERSION_SLUG: ${{ needs.source.outputs.version_slug }}
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Materialize private dependency deploy keys
        shell: bash
        env:
          MC_CI_CORECPP_DEPLOY_KEY: ${{ secrets.MC_CI_CORECPP_DEPLOY_KEY }}
          MC_CI_COREPROJECT2026_DEPLOY_KEY: ${{ secrets.MC_CI_COREPROJECT2026_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_root="$RUNNER_TEMP/private-dependency-keys"
          install -d -m 700 "$key_root"
          umask 077
          printf '%s\n' "$MC_CI_CORECPP_DEPLOY_KEY" > "$key_root/corecpp"
          printf '%s\n' "$MC_CI_COREPROJECT2026_DEPLOY_KEY" > "$key_root/coreproject2026"
          echo "MC_CI_CORECPP_DEPLOY_KEY_FILE=$key_root/corecpp" >> "$GITHUB_ENV"
          echo "MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE=$key_root/coreproject2026" >> "$GITHUB_ENV"
      - name: Fetch exact private dependency commits
        shell: bash
        run: >-
          python script/ci/acquire.py fetch-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies"
          --corecpp-key "$MC_CI_CORECPP_DEPLOY_KEY_FILE"
          --coreproject2026-key "$MC_CI_COREPROJECT2026_DEPLOY_KEY_FILE"
      - name: Select Java 21 from the hosted tool cache
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Bootstrap and acquire pinned Android SDK components
        run: python script/ci/acquire.py install-android-sdk --root "$RUNNER_TEMP/android-sdk"
      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check --no-cache-dir cmake==3.31.6
      - name: Acquire pinned vcpkg
        run: python script/ci/acquire.py install-vcpkg --root "$RUNNER_TEMP/vcpkg"
      - name: Install pinned private dependencies
        run: >-
          python script/ci/acquire.py install-private-dependencies
          --root "$RUNNER_TEMP/private-dependencies" --platform android
          --cmake-arg "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          --cmake-arg "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"
          --cmake-arg "-DVCPKG_TARGET_TRIPLET=arm64-android"
          --cmake-arg "-DANDROID_ABI=arm64-v8a"
          --cmake-arg "-DANDROID_PLATFORM=android-28"
      - name: Verify exact source and Android wrapper
        run: |
          python script/ci/build_snapshot.py source-identity --expected "$SOURCE_COMMIT" --version "$SNAPSHOT_VERSION" --output build/source-identity.json
          python script/ci/build_snapshot.py verify-android-source --root android
      - name: Verify finalized source policy
        run: python script/ci/acquire.py source-checks
      - name: Build and package development APK
        run: |
          set -euo pipefail
          android/gradlew --no-daemon --stacktrace :app:assembleDebug
          python script/ci/build_snapshot.py record-android-metadata --android-root android --vcpkg-root "$VCPKG_ROOT" --source-commit "$SOURCE_COMMIT" --output build/toolchain-android.json
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-ci-development.apk"
          python script/package_snapshot.py android \
            --apk "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-ci-development.apk" \
            --api-level 35 --abi arm64-v8a --signing development --source-exactness exact \
            --version "$SNAPSHOT_VERSION" --source-commit "$SOURCE_COMMIT" \
            --toolchain-evidence build/toolchain-android.json \
            --output "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-evidence.json"
          python script/ci/build_snapshot.py license-archive \
            --vcpkg-installed android/app/.cxx --work-root build/package-android \
            --output "dist/minecraftclone-${VERSION_SLUG}-android-licenses.zip"
          python script/ci/build_snapshot.py write-evidence \
            --platform android --configuration development-debug --automated-verification build-only \
            --version "$SNAPSHOT_VERSION" --source-commit "$SOURCE_COMMIT" \
            --artifact "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-ci-development.apk" \
            --toolchain-evidence build/toolchain-android.json \
            --output "dist/minecraftclone-${VERSION_SLUG}-android-build-evidence.json"
          python script/ci/build_snapshot.py write-checksum \
            --artifact "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-ci-development.apk" \
            --output "dist/minecraftclone-${VERSION_SLUG}-android-arm64-v8a-ci-development.apk.sha256"
          python script/ci/build_snapshot.py write-checksum \
            --artifact "dist/minecraftclone-${VERSION_SLUG}-android-licenses.zip" \
            --output "dist/minecraftclone-${VERSION_SLUG}-android-licenses.zip.sha256"
          python script/ci/acquire.py verify-private-dependency-artifact-exclusion \
            --artifact-root dist --private-dependency-root "$RUNNER_TEMP/private-dependencies"
      - name: Upload Android release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-android-${{ needs.source.outputs.version_slug }}-${{ needs.source.outputs.source_commit }}
          path: |
            dist/*
            build/source-identity.json
            build/toolchain-android.json
          if-no-files-found: error
          retention-days: 14
