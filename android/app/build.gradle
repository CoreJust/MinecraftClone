plugins {
    id 'com.android.application'
}

import java.util.zip.ZipFile

def vcpkgRoot = providers.gradleProperty('vcpkgRoot')
    .orElse(providers.environmentVariable('VCPKG_ROOT'))
    .orNull
if (vcpkgRoot == null || vcpkgRoot.trim().isEmpty()) {
    throw new GradleException('Set VCPKG_ROOT or pass -PvcpkgRoot=/path/to/vcpkg.')
}

def vcpkgToolchain = file("${vcpkgRoot}/scripts/buildsystems/vcpkg.cmake")
if (!vcpkgToolchain.isFile()) {
    throw new GradleException("vcpkg toolchain does not exist: ${vcpkgToolchain}")
}
def vcpkgInstalledDir = providers.gradleProperty('vcpkgInstalledDir')
    .orElse(providers.environmentVariable('VCPKG_INSTALLED_DIR'))
    .orNull
def vcpkgManifestInstall = providers.gradleProperty('vcpkgManifestInstall')
    .orElse('ON')
    .get()
def cmakePrefixPath = providers.gradleProperty('cmakePrefixPath')
    .orElse(providers.environmentVariable('MC_CMAKE_PREFIX_PATH'))
    .orNull
def coreCppDir = providers.gradleProperty('coreCppDir')
    .orElse(providers.environmentVariable('CORECPP_DIR'))
    .orNull
def coreProjectDir = providers.gradleProperty('coreProjectDir')
    .orElse(providers.environmentVariable('COREPROJECT2026_DIR'))
    .orNull
def sanitizer = providers.gradleProperty('sanitizer').orNull
def androidApi = sanitizer == 'hwasan' ? 29 : 28
def vcpkgTargetTriplet = sanitizer == 'hwasan' ? 'arm64-android-hwasan' : 'arm64-android'
def vcpkgOverlayTriplets = file('../../script/ci/vcpkg-triplets')
def vcpkgOverlayPorts = file('../../script/ci/vcpkg-overlays')

def fallbackShaderSources = layout.buildDirectory.dir('generated/fallback-shaders')
def requiredShaderAssets = [
    'text.frag.spv',
    'text.vert.spv',
    'grid.vert.spv',
    'player.vert.spv',
    'stone.vert.spv',
    'stone.frag.spv',
    'stone_solid.frag.spv',
    'sky.vert.spv',
    'sky.frag.spv',
    'trivial.frag.spv',
]
def hudLicenseAssets = file("${buildDir}/generated/hud-licenses")
def hwasanWrapAssets = layout.buildDirectory.dir('generated/hwasan-wrap')
def requiredHudLicenseAssets = [
    'licenses/hud/DEBUG_HUD_ATTRIBUTION.md',
    'licenses/hud/TAMSYN_LICENSE.txt',
]
def stageFallbackShaders = tasks.register('stageFallbackShaders', Sync) {
    from('../../src/client/render/shaders') {
        include 'grid.vert'
        include 'player.vert'
        include 'stone.vert'
        include 'stone.frag'
        include 'trivial.frag'
        include 'text.vert'
        include 'text.frag'
        include 'stone_solid.frag'
        include 'sky.vert'
        include 'sky.frag'
    }
    into(fallbackShaderSources)
}
def stageHudLicenses = tasks.register('stageHudLicenses', Sync) {
    from('../../src/client/render/shaders') {
        include 'DEBUG_HUD_ATTRIBUTION.md'
        include 'TAMSYN_LICENSE.txt'
    }
    into(new File(hudLicenseAssets, 'licenses/hud'))
}
def stageHwasanWrap = tasks.register('stageHwasanWrap') {
    outputs.dir(hwasanWrapAssets)
    doLast {
        File libDirectory = new File(new File(hwasanWrapAssets.get().asFile, 'lib'), 'arm64-v8a')
        if (!libDirectory.mkdirs() && !libDirectory.isDirectory()) {
            throw new GradleException("Cannot create HWASan wrap directory: ${libDirectory}")
        }
        File wrap = new File(libDirectory, 'wrap.sh')
        wrap.setText('#!/system/bin/sh\nLD_HWASAN=1 exec "$@"\n', 'UTF-8')
        if (!wrap.setExecutable(true, false)) {
            throw new GradleException("Cannot mark HWASan wrap script executable: ${wrap}")
        }
    }
}

def projectInfoText = file('../../src/shared/include/shared/ProjectInfo.hpp').getText('UTF-8')
def projectVersionField = { String field ->
    def matcher = projectInfoText =~ /\.${field}\s*=\s*(\d+)/
    if (!matcher.find()) {
        throw new GradleException("PROJECT_VERSION.${field} is missing from ProjectInfo.hpp")
    }
    return matcher.group(1).toInteger()
}
def projectEpoch = projectVersionField('epoch')
def projectMajor = projectVersionField('major')
def projectMinor = projectVersionField('minor')
def projectSnapshot = projectVersionField('patch')
if (projectEpoch > 20 || projectMajor > 99 || projectMinor > 99 || projectSnapshot > 9_999) {
    throw new GradleException('PROJECT_VERSION cannot be represented as an Android versionCode')
}
def projectVersionCode = projectEpoch * 100_000_000 \
    + projectMajor * 1_000_000 \
    + projectMinor * 10_000 \
    + projectSnapshot
if (projectVersionCode < 1) {
    throw new GradleException('PROJECT_VERSION must produce a positive Android versionCode')
}
def projectVersionName = "${projectEpoch}.${projectMajor}.${projectMinor}:${projectSnapshot}"

android {
    namespace 'com.corejust.minecraftclone'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.corejust.minecraftclone'
        minSdk androidApi
        targetSdk 35
        versionCode projectVersionCode
        versionName projectVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                    "-DANDROID_PLATFORM=android-${androidApi}",
                    "-DVCPKG_TARGET_TRIPLET=${vcpkgTargetTriplet}"
                targets 'mc_android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.30.5'
        }
    }

    sourceSets {
        main {
            shaders.setSrcDirs([fallbackShaderSources])
            assets.setSrcDirs([hudLicenseAssets])
            if (sanitizer == 'hwasan') {
                resources.srcDir(hwasanWrapAssets)
            }
        }
    }

    buildTypes {
        debug {
            // Android's standard debug keystore is intentionally the only signer.
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release',
                        '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG',
                        '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG'
                }
            }
        }
    }
}

def ndkToolchain = new File(android.ndkDirectory, 'build/cmake/android.toolchain.cmake')
if (!ndkToolchain.isFile()) {
    throw new GradleException("NDK ${android.ndkVersion} is missing its CMake toolchain: ${ndkToolchain}")
}

// vcpkg owns the outer toolchain and must chainload the NDK toolchain. Keeping
// both paths Gradle-derived prevents a host path from entering source control.
android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
    "-DCMAKE_TOOLCHAIN_FILE=${vcpkgToolchain.absolutePath}",
    "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ndkToolchain.absolutePath}",
    "-DVCPKG_MANIFEST_INSTALL=${vcpkgManifestInstall}"
])
if (sanitizer != null) {
    if (sanitizer != 'hwasan') {
        throw new GradleException("Unsupported Android sanitizer '${sanitizer}'; only hwasan is supported")
    }
    android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
        '-DCMAKE_BUILD_TYPE=Release',
        '-DMC_ENABLE_HIGH_ASSERT=OFF',
        '-DMC_ENABLE_SANITIZERS=ON',
        '-DMC_SANITIZER=hwaddress',
        '-DANDROID_SANITIZE=hwaddress',
        "-DVCPKG_OVERLAY_TRIPLETS=${vcpkgOverlayTriplets.absolutePath}",
        "-DVCPKG_OVERLAY_PORTS=${vcpkgOverlayPorts.absolutePath}"
    ])
    android.buildTypes.release.signingConfig android.signingConfigs.debug
    android.buildTypes.release.applicationIdSuffix = '.hwasan'
    android.buildTypes.release.debuggable = true
    android.packaging.jniLibs.useLegacyPackaging = true
    tasks.named('preBuild').configure {
        dependsOn(stageHwasanWrap)
    }
}
if (vcpkgInstalledDir != null && !vcpkgInstalledDir.trim().isEmpty()) {
    android.defaultConfig.externalNativeBuild.cmake.arguments.add(
        "-DVCPKG_INSTALLED_DIR=${file(vcpkgInstalledDir).absolutePath}"
    )
}
if (cmakePrefixPath != null && !cmakePrefixPath.trim().isEmpty()) {
    android.defaultConfig.externalNativeBuild.cmake.arguments.add(
        "-DCMAKE_PREFIX_PATH=${cmakePrefixPath}"
    )
}
if (coreCppDir != null && !coreCppDir.trim().isEmpty()) {
    android.defaultConfig.externalNativeBuild.cmake.arguments.add(
        "-DCoreCpp_DIR=${file(coreCppDir).absolutePath}"
    )
}
if (coreProjectDir != null && !coreProjectDir.trim().isEmpty()) {
    android.defaultConfig.externalNativeBuild.cmake.arguments.add(
        "-DCoreProject2026_DIR=${file(coreProjectDir).absolutePath}"
    )
}

tasks.configureEach {
    if (name ==~ /.*[Ll]int.*/) {
        dependsOn(stageHudLicenses)
    }
    if (name ==~ /(merge|compile).+Shaders/) {
        dependsOn(stageFallbackShaders)
    }
    if (name ==~ /merge.+Assets/) {
        dependsOn(stageHudLicenses)
    }
}

def verifyDebugShaderAssets = tasks.register('verifyDebugShaderAssets') {
    doLast {
        File apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apk.isFile()) {
            throw new GradleException("Debug APK is missing: ${apk}")
        }
        ZipFile zip = new ZipFile(apk)
        try {
            requiredShaderAssets.each { String asset ->
                if (zip.getEntry("assets/shaders/${asset}") == null) {
                    throw new GradleException("Debug APK is missing shader asset: ${asset}")
                }
            }
            requiredHudLicenseAssets.each { String asset ->
                if (zip.getEntry("assets/${asset}") == null) {
                    throw new GradleException("Debug APK is missing HUD attribution/license asset: ${asset}")
                }
            }
            if (sanitizer == 'hwasan' && zip.getEntry('lib/arm64-v8a/wrap.sh') == null) {
                throw new GradleException('HWASan APK is missing lib/arm64-v8a/wrap.sh')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.configureEach {
    if (name == 'assembleDebug') {
        finalizedBy(verifyDebugShaderAssets)
    }
}

if (sanitizer == 'hwasan') {
    def verifyHwasanReleaseApk = tasks.register('verifyHwasanReleaseApk') {
        doLast {
            if (!android.buildTypes.release.debuggable) {
                throw new GradleException('HWASan Release APK must be debuggable for wrap.sh')
            }
            if (android.packaging.jniLibs.useLegacyPackaging != true) {
                throw new GradleException('HWASan Release APK must use legacy JNI packaging')
            }

            File apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
            if (!apk.isFile()) {
                throw new GradleException("HWASan Release APK is missing: ${apk}")
            }
            ZipFile zip = new ZipFile(apk)
            try {
                def wrapEntry = zip.getEntry('lib/arm64-v8a/wrap.sh')
                if (wrapEntry == null) {
                    throw new GradleException('HWASan Release APK is missing lib/arm64-v8a/wrap.sh')
                }
                String wrap = new String(zip.getInputStream(wrapEntry).readAllBytes(), 'UTF-8')
                if (wrap != '#!/system/bin/sh\nLD_HWASAN=1 exec "$@"\n') {
                    throw new GradleException('HWASan Release APK has an invalid lib/arm64-v8a/wrap.sh')
                }

                def nativeEntry = zip.getEntry('lib/arm64-v8a/libmc_android.so')
                if (nativeEntry == null) {
                    throw new GradleException('HWASan Release APK is missing lib/arm64-v8a/libmc_android.so')
                }
                byte[] nativeBytes = zip.getInputStream(nativeEntry).readAllBytes()
                if (nativeBytes.length < 64 ||
                    (nativeBytes[0] & 0xff) != 0x7f ||
                    (nativeBytes[1] & 0xff) != 0x45 ||
                    (nativeBytes[2] & 0xff) != 0x4c ||
                    (nativeBytes[3] & 0xff) != 0x46 ||
                    (nativeBytes[4] & 0xff) != 2 ||
                    (nativeBytes[5] & 0xff) != 1 ||
                    (nativeBytes[18] & 0xff) != 183 ||
                    (nativeBytes[19] & 0xff) != 0
                ) {
                    throw new GradleException('HWASan Release APK native library is not a 64-bit little-endian AArch64 ELF')
                }
                String nativeLibrary = new String(nativeBytes, 'ISO-8859-1')
                if (!nativeLibrary.contains('libclang_rt.hwasan-aarch64-android.so')) {
                    throw new GradleException('HWASan Release APK native library is not linked with the HWASan runtime')
                }
            } finally {
                zip.close()
            }
        }
    }

    tasks.configureEach {
        if (name == 'assembleRelease') {
            finalizedBy(verifyHwasanReleaseApk)
        }
    }
}
